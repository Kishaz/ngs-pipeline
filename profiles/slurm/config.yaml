# =============================================================================
# SLURM Cluster Profile for Snakemake
# Usage: snakemake --profile profiles/slurm
# =============================================================================

executor: slurm

# --- Default resources (applied to all rules unless overridden) ---
default-resources:
  slurm_account: "yateslab_genomics"
  slurm_partition: "general"
  mem_mb: 8000
  runtime: 60
  cpus_per_task: 1
  slurm_extra: "'--mail-type=FAIL'"

# --- Per-rule thread overrides ---
set-threads:
  # QC
  fastp_pe: 4
  fastp_se: 4
  fastqc_raw_r1: 2
  fastqc_raw_r2: 2
  fastqc_trimmed_r1: 2
  fastqc_trimmed_r2: 2
  # Alignment
  bwa_mem2_align: 16
  hisat2_align: 16
  samtools_sort: 8
  samtools_index: 4
  index_recal_bam: 4
  # Variant calling
  haplotype_caller: 4
  genomics_db_import: 4
  genotype_gvcfs: 4
  # RNA
  featurecounts: 4
  # Ancestry
  run_ancestry: 4

# --- Per-rule resource overrides ---
set-resources:
  # QC
  fastp_pe:
    mem_mb: 8000
    runtime: 120
  fastp_se:
    mem_mb: 8000
    runtime: 120
  # Alignment
  bwa_mem2_align:
    mem_mb: 48000
    runtime: 480
  hisat2_align:
    mem_mb: 32000
    runtime: 480
  samtools_sort:
    mem_mb: 32000
    runtime: 180
  mark_duplicates:
    mem_mb: 32000
    runtime: 240
  # BQSR
  base_recalibrator:
    mem_mb: 16000
    runtime: 360
  apply_bqsr:
    mem_mb: 16000
    runtime: 360
  # Variant calling
  haplotype_caller:
    mem_mb: 16000
    runtime: 720
  genomics_db_import:
    mem_mb: 48000
    runtime: 480
  genotype_gvcfs:
    mem_mb: 32000
    runtime: 480
  # Ancestry
  run_ancestry:
    mem_mb: 80000
    runtime: 1440

# --- Snakemake execution settings ---
use-envmodules: true
latency-wait: 120
jobs: 50
keep-going: true
rerun-incomplete: true
printshellcmds: true
