# =============================================================================
# SLURM Cluster Profile for Snakemake  ★ RECOMMENDED for cohorts / long runs ★
# Usage: snakemake --profile profiles/slurm
#
# Submits each rule as its own SLURM job, fanning work across the cluster with
# per-job memory enforced — this is how you use the HPC's parallelism and avoid
# the single-node OOMs that profiles/local is prone to. For long multi-sample
# runs, drive it from `tmux` on a login node so it survives disconnects (see the
# "Long runs & large cohorts" section of the README).
# =============================================================================

executor: slurm

# --- Default resources (applied to all rules unless overridden) ---
default-resources:
  slurm_account: "yateslab_genomics"
  slurm_partition: "cpu"               # DISCOVERY's default CPU partition (10-day limit).
                                       # NOTE: "general" is not valid here — verify with `sinfo -s`.
  mem_mb: 8000
  runtime: 60
  cpus_per_task: 1
  slurm_extra: "'--mail-type=FAIL'"

# --- Per-rule thread overrides ---
set-threads:
  # QC
  fastp_pe: 4
  fastp_se: 4
  fastqc_raw_r1: 2
  fastqc_raw_r2: 2
  fastqc_trimmed_r1: 2
  fastqc_trimmed_r2: 2
  # Alignment
  bwa_mem2_align: 16
  hisat2_align: 16
  samtools_sort: 8
  samtools_index: 4
  index_recal_bam: 4
  # Variant calling
  haplotype_caller: 4
  genomics_db_import: 4
  genotype_gvcfs: 4
  # RNA
  featurecounts: 4
  # Ancestry
  run_ancestry: 4

# --- Per-rule resource overrides ---
set-resources:
  # QC
  fastp_pe:
    mem_mb: 8000
    runtime: 120
  fastp_se:
    mem_mb: 8000
    runtime: 120
  # Alignment
  bwa_mem2_align:
    mem_mb: 48000
    runtime: 480
  hisat2_align:
    mem_mb: 32000
    runtime: 480
  samtools_sort:
    mem_mb: 32000
    runtime: 180
  mark_duplicates:
    mem_mb: 32000
    runtime: 240
  # BQSR
  base_recalibrator:
    mem_mb: 16000
    runtime: 360
  apply_bqsr:
    mem_mb: 16000
    runtime: 360
  # Variant calling
  haplotype_caller:
    mem_mb: 16000
    runtime: 720
  genomics_db_import:
    mem_mb: 48000
    runtime: 480
  genotype_gvcfs:
    mem_mb: 32000
    runtime: 480
  # Ancestry
  run_ancestry:
    mem_mb: 80000
    runtime: 1440

# --- Snakemake execution settings ---
use-envmodules: true
latency-wait: 120

# THROUGHPUT KNOB: max concurrent SLURM jobs. Alignment is per-sample and the
# dominant cost, so this is what sets cohort wall-clock — set it to (at least)
# your cohort size so every sample can align at once, bounded by your account's
# QOS / partition limits. Check your ceiling with:
#   sacctmgr -n show assoc user=$USER format=account,qos,maxjobs,maxsubmit
#   sinfo -o "%P %a %l %D %c" -h        # partition cpu limits / node core counts
# 167 samples × 16 cpus would be ~2600 cores if fully parallel — the cluster/QOS
# will queue the overflow automatically, so it is safe to set this high.
jobs: 150

# ROBUSTNESS on long many-sample runs: retry a job that dies from a transient
# node / filesystem hiccup instead of losing that sample. keep-going means one
# genuinely-bad sample never stops the rest of the cohort.
retries: 2
keep-going: true

# Be gentle on the scheduler when hundreds of jobs are in flight.
max-jobs-per-second: 10
max-status-checks-per-second: 5

rerun-incomplete: true
printshellcmds: true
